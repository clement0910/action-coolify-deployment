name: "action-coolify"
description: "Trigger Coolify Deployments (and wait for them to finish)"
inputs:
  coolify-url:
    description: "Coolify base URL or API URL. Inferred from webhook when provided."
    required: false
  api-key:
    description: "Coolify API key. Can also be provided as coolify-token or COOLIFY_TOKEN."
    required: false
  coolify-token:
    description: "Coolify API key alias."
    required: false
  webhook:
    description: "Full Coolify deploy URL, for example https://coolify.example.com/api/v1/deploy?uuid=app_uuid&force=false. uuid, tag, and force are inferred from the query string."
    required: false
  coolify-webhook:
    description: "Coolify deploy URL alias. Can also be provided as COOLIFY_WEBHOOK_STAGING or COOLIFY_WEBHOOK."
    required: false
  wait:
    description: "Seconds to wait for the deployment to finish"
    required: false
    default: "600"
  tag:
    description: "Tag name(s). Comma separated list is also accepted."
    required: false
  uuid:
    description: "Resource UUID(s). Comma separated list is also accepted."
    required: false
  force:
    description: "Force rebuild (without cache)"
    required: false

runs:
  using: "node20"
  main: dist/action.js
